version: "2"

linters:
  default: standard # errcheck, govet, ineffassign, staticcheck, unused
  enable:
    - errorlint
    - gosec
    - misspell
    - nolintlint
  settings:
    gosec:
      excludes:
        # Opening the files named by -i and -o is the purpose of this CLI.
        - G304
  exclusions:
    rules:
      # Tests build and run the CLI binary and create files in t.TempDir().
      - path: _test\.go
        linters: [gosec]
        text: "G204|G301|G302|G306"
