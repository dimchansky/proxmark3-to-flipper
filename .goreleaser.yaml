# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
#
# Release configuration, checked with GoReleaser v2.18.3 (pinned in the
# workflows). Archives are built by GoReleaser and checked by
# tools/verifydist; the release workflow uploads the verified files to a draft
# GitHub release. Local dry run:
#
#   goreleaser release --snapshot --clean
#   go run ./tools/verifydist -dist dist -snapshot
version: 2

project_name: proxmark3-to-flipper

builds:
  - id: proxmark3-to-flipper
    main: .
    binary: proxmark3-to-flipper
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    # Only the version and commit the CLI reads (main.go); no build date, so a
    # rebuild of the same commit is byte-for-byte identical.
    ldflags:
      - -s -w -X main.version={{ .Version }} -X main.commit={{ .FullCommit }}
    mod_timestamp: "{{ .CommitTimestamp }}"
    # Keep in sync with tools/verifydist.
    targets:
      - windows_amd64_v1
      - windows_arm64_v8.0
      - darwin_amd64_v1
      - darwin_arm64_v8.0
      - linux_amd64_v1
      - linux_arm64_v8.0
      - linux_arm_7

archives:
  - id: proxmark3-to-flipper
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    # e.g. proxmark3-to-flipper_1.0.0_macos_arm64.tar.gz, …_linux_armv7.tar.gz
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_
      {{- if eq .Os "darwin" }}macos{{ else }}{{ .Os }}{{ end }}_
      {{- .Arch }}{{ if .Arm }}v{{ .Arm }}{{ end }}
    # Fixed metadata so that the archive bytes depend only on the commit.
    builds_info:
      owner: root
      group: root
      mtime: "{{ .CommitDate }}"
    files:
      - src: LICENSE
        info: &file_info
          owner: root
          group: root
          mode: 0644
          mtime: "{{ .CommitDate }}"
      - src: README.md
        info: *file_info

checksum:
  name_template: "{{ .ProjectName }}_{{ .Version }}_checksums.txt"
  algorithm: sha256

metadata:
  mod_timestamp: "{{ .CommitTimestamp }}"

snapshot:
  # Never looks like a release: e.g. 1.0.1-SNAPSHOT-1a2b3c4.
  version_template: "{{ incpatch .Version }}-SNAPSHOT-{{ .ShortCommit }}"

# Release notes are written by hand, not generated from commit messages.
changelog:
  disable: true

release:
  github:
    owner: dimchansky
    name: proxmark3-to-flipper
  # Only ever create drafts; a person publishes after reviewing. The release
  # workflow uploads the verified files itself (--skip=publish), so these
  # settings matter for a manual "goreleaser release".
  draft: true
  replace_existing_draft: false
  use_existing_draft: false
  replace_existing_artifacts: false
  prerelease: auto
  preflight:
    fail_on_error: true
